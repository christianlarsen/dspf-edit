<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Hexagonal background (regular hexagon) -->
  <path d="M256 31 L450.9 143.5 L450.9 368.5 L256 481 L61.1 368.5 L61.1 143.5 Z"
        fill="url(#hexGradient)"
        filter="url(#shadow)"
        stroke="none"/>

  <!-- Display screen representation -->
  <rect x="119.8" y="120" width="272.3" height="140"
        rx="8" ry="8"
        fill="white"
        stroke="none"/>

  <!-- Screen bezel/frame -->
  <rect x="110.4" y="112" width="291.1" height="156"
        rx="12" ry="12"
        fill="none"
        stroke="white"
        stroke-width="6"/>

  <!-- Field representations inside screen -->
  <rect x="143.3" y="140" width="93.9" height="12"
        rx="2" ry="2"
        fill="#0077B6"
        opacity="0.7"/>

  <rect x="260.7" y="140" width="70.4" height="12"
        rx="2" ry="2"
        fill="#0077B6"
        opacity="0.7"/>

  <rect x="143.3" y="170" width="117.4" height="12"
        rx="2" ry="2"
        fill="#0077B6"
        opacity="0.7"/>

  <rect x="284.2" y="170" width="47.0" height="12"
        rx="2" ry="2"
        fill="#0077B6"
        opacity="0.7"/>

  <rect x="143.3" y="200" width="140.9" height="12"
        rx="2" ry="2"
        fill="#0077B6"
        opacity="0.7"/>

  <rect x="307.6" y="200" width="23.5" height="12"
        rx="2" ry="2"
        fill="#0077B6"
        opacity="0.7"/>

  <rect x="143.3" y="230" width="82.2" height="12"
        rx="2" ry="2"
        fill="#0077B6"
        opacity="0.7"/>

  <!-- Connection lines showing DDS structure -->
  <g stroke="white" stroke-width="4" fill="none" opacity="0.8">
    <!-- Central hub -->
    <circle cx="256" cy="320" r="20" fill="white"/>

    <!-- Connection lines -->
    <line x1="256" y1="300" x2="256" y2="268"/>
    <line x1="232.5" y1="320" x2="166.8" y2="320"/>
    <line x1="279.5" y1="320" x2="345.2" y2="320"/>
    <line x1="241.9" y1="335" x2="190.3" y2="365"/>
    <line x1="270.1" y1="335" x2="321.7" y2="365"/>

    <!-- End nodes -->
    <circle cx="166.8" cy="320" r="12" fill="white"/>
    <circle cx="345.2" cy="320" r="12" fill="white"/>
    <circle cx="190.3" cy="365" r="12" fill="white"/>
    <circle cx="321.7" cy="365" r="12" fill="white"/>
  </g>

  <!-- DDS text indicator -->
  <text x="256" y="430"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        text-anchor="middle"
        fill="white"
        opacity="0.9">DDS</text>
</svg>
